{% extends "students/base.html" %}

{% block content %}

<h1>Edit Student</h1>

<form method="POST">
    {% csrf_token %}

    <label>Full Name</label>
    <input
        type="text"
        name="full_name"
        value="{{ student.full_name }}"
        required
    >

    <br><br>

    <label>Email</label>
    <input
        type="email"
        name="email"
        value="{{ student.email }}"
        required
    >

    <br><br>

    <label>Phone</label>
    <input
        type="text"
        name="phone"
        value="{{ student.phone }}"
        required
    >

    <br><br>

    <label>Course</label>
    <input
        type="text"
        name="course"
        value="{{ student.course }}"
        required
    >

    <br><br>

    <button type="submit">Update Student</button>
</form>

{% endblock %}
